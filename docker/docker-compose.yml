# ============================================================
# LifecycleCM — Docker Compose
# Defines: PostgreSQL (Library DB), PostgreSQL (Resource DB),
#          MinIO, ecm-resource-manager, ecm-library-service.
# Frontend services (ecm-admin, ecm-client) are added in Phase 5.
#
# Startup sequence enforced via depends_on + health checks:
#   postgres-library, postgres-resource, minio
#     → ecm-resource-manager
#     → ecm-library-service
#
# Usage:
#   Development:  docker compose up -d postgres-library postgres-resource minio
#   Full stack:   docker compose up --build -d
# ============================================================

version: "3.9"

services:

  # ----------------------------------------------------------
  # PostgreSQL — Library Database
  # Owns all metadata: documents, attributes, lifecycle history,
  # users, roles, retention policies, workflow, PHI audit log.
  # ----------------------------------------------------------
  postgres-library:
    image: postgres:16-alpine
    container_name: postgres-library
    environment:
      POSTGRES_DB: ecm_library_db
      POSTGRES_USER: ecm_user
      POSTGRES_PASSWORD: ecm_library_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-library-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecm_user -d ecm_library_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecm-net

  # ----------------------------------------------------------
  # PostgreSQL — Resource Database
  # Owns only: content_object table (UUID, storage key, checksum,
  # size, MIME type). Nothing else.
  # ----------------------------------------------------------
  postgres-resource:
    image: postgres:16-alpine
    container_name: postgres-resource
    environment:
      POSTGRES_DB: ecm_resource_db
      POSTGRES_USER: ecm_rm_user
      POSTGRES_PASSWORD: ecm_resource_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-resource-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecm_rm_user -d ecm_resource_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecm-net

  # ----------------------------------------------------------
  # MinIO — Binary Content Store
  # S3-compatible object storage. Bucket is created on first
  # startup by the minio-init sidecar below.
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console — http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecm-net

  # ----------------------------------------------------------
  # MinIO Init — one-shot sidecar that creates the ecm-content
  # bucket on first run then exits. Safe to run on every startup:
  # mc mb is idempotent (--ignore-existing).
  # ----------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set ecmstore http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing ecmstore/ecm-content &&
        echo 'Bucket ecm-content ready' &&
        exit 0
      "
    networks:
      - ecm-net

  # ----------------------------------------------------------
  # ecm-resource-manager — Resource Manager Service
  # Starts after both its database and MinIO are healthy.
  # ----------------------------------------------------------
  ecm-resource-manager:
    build:
      context: ../ecm-resource-manager
      dockerfile: Dockerfile
    container_name: ecm-resource-manager
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres-resource:5432/ecm_resource_db
      DB_USERNAME: ecm_rm_user
      DB_PASSWORD: ecm_resource_pass
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: ecm-content
    depends_on:
      postgres-resource:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ecm-net

  # ----------------------------------------------------------
  # ecm-library-service — Library Service
  # Starts after its database and after Resource Manager is healthy.
  # The Library Service calls the RM on startup to verify connectivity.
  # ----------------------------------------------------------
  ecm-library-service:
    build:
      context: ../ecm-library-service
      dockerfile: Dockerfile
    container_name: ecm-library-service
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres-library:5432/ecm_library_db
      DB_USERNAME: ecm_user
      DB_PASSWORD: ecm_library_pass
      JWT_SECRET: ${JWT_SECRET:-change-me-before-production-min-256-bits-long}
      RM_BASE_URL: http://ecm-resource-manager:8081
      RETENTION_SCAN_CRON: "0 0 2 * * *"
    depends_on:
      postgres-library:
        condition: service_healthy
      ecm-resource-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - ecm-net

# ============================================================
# Volumes — named volumes survive container restarts.
# Use "docker compose down -v" only for a full clean reset.
# ============================================================
volumes:
  postgres-library-data:
  postgres-resource-data:
  minio-data:

# ============================================================
# Network — isolated bridge network; services communicate by
# container name, not localhost.
# ============================================================
networks:
  ecm-net:
    driver: bridge
    